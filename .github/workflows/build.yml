name: Build and release

on:
  push:
    branches:
      - master
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore diashow.sln --runtime win-x64

      - name: Run tests
        run: dotnet test tests/diashow.Tests.csproj --configuration Release --no-restore

      - name: Run UI tests
        run: dotnet test ui-tests/diashow.UiTests.csproj --configuration Release --no-restore

      - name: Upload UI test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-screenshots
          path: TestResults/ui-screenshots/*.png
          if-no-files-found: error

      - name: Read project version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content diashow/diashow.csproj
          $version = $project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'The project version is missing.'
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish self-contained application
        run: >
          dotnet publish diashow/diashow.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --no-restore
          --output publish/app

      - name: Publish self-contained installer
        run: >
          dotnet publish installer/Diashow.Installer.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --no-restore
          --output publish/installer

      - name: Publish self-contained updater
        run: >
          dotnet publish updater/Diashow.Updater.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --no-restore
          --output publish/updater

      - name: Archive build outputs
        uses: actions/upload-artifact@v4
        with:
          name: diashow-build-${{ github.run_id }}
          path: |
            publish/app/Diashow.exe
            publish/installer/Diashow.Installer.exe
            publish/updater/Diashow.Updater.exe
          if-no-files-found: error

      - name: Archive develop executables
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: diashow-${{ steps.version.outputs.version }}-develop
          path: |
            publish/app/Diashow.exe
            publish/installer/Diashow.Installer.exe
            publish/updater/Diashow.Updater.exe
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download build outputs
        uses: actions/download-artifact@v4.1.3
        with:
          name: diashow-build-${{ github.run_id }}
          path: publish

      - name: Read project version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content diashow/diashow.csproj
          $version = $project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'The project version is missing.'
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Create signed release artifacts
        shell: pwsh
        env:
          DIASHOW_ED25519_PRIVATE_KEY: ${{ secrets.DIASHOW_ED25519_PRIVATE_KEY }}
        run: .\scripts\Sign-Release.ps1 -Executable publish/app/Diashow.exe

      - name: Ensure master release does not already exist
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.version }}
        run: |
          git fetch --tags --force
          if ($LASTEXITCODE -ne 0) {
            throw 'Fetching tags failed.'
          }
          if (git show-ref --tags --verify --quiet "refs/tags/$env:RELEASE_TAG") {
            throw "Tag $env:RELEASE_TAG already exists."
          }
          gh release view $env:RELEASE_TAG *> $null
          $releaseLookupExitCode = $LASTEXITCODE
          if ($releaseLookupExitCode -eq 0) {
            throw "Release $env:RELEASE_TAG already exists."
          }
          if ($releaseLookupExitCode -ne 1) {
            throw "Could not determine whether release $env:RELEASE_TAG exists."
          }
          $global:LASTEXITCODE = 0
      - name: Create master release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.version }}
        run: >
          gh release create $env:RELEASE_TAG
          publish/app/Diashow.exe
          publish/installer/Diashow.Installer.exe
          publish/updater/Diashow.Updater.exe
          publish/app/Diashow.exe.sha256
          publish/app/Diashow.exe.sig
          --title $env:RELEASE_TAG
          --target $env:GITHUB_SHA
          --generate-notes
          --latest
